<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00D084" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050807" stop-opacity="1"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.02"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="630" fill="#050807"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Logo Mark -->
  <g transform="translate(120, 150)">
    <rect x="0" y="0" width="48" height="112" rx="12" fill="none" stroke="#00D084" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="64" y="0" width="48" height="112" rx="12" fill="none" stroke="#00D084" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="120" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="96" font-weight="bold" fill="#ffffff" letter-spacing="-2">Trade Window</text>

  <!-- Subtitle -->
  <text x="120" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#00D084" letter-spacing="-0.5">OTC Trade Room for AtomOne &amp; Gno.land</text>

  <!-- Support Line -->
  <text x="120" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#9ca3af">Public OTC board · Structured deal intents · Gno commitment layer</text>

  <!-- Domain -->
  <text x="120" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#6b7280">tradewindow.xyz</text>
</svg>
